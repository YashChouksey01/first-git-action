# 1
name:  first-workflow     # name of workflow
on:  workflow_dispatch    # its called github event, which triggers the workflow.  Here, workflow_dispatch is a manual trigger for the workflow.
jobs:                     # jobs is a collection of steps that execute on the same runner. Each job runs in a fresh instance of the virtual environment.
  first_job:              # name of the job
    runs-on: ubuntu-slim  # specifies the operating system for the runner
    steps:                # steps is a list of all the actions that will be executed in the job
      - name:  print hello
        run:  echo "hello learning workflow in git hub"
      - name:  print bye
        run:  echo "bye"
    


# A runner is the machine/virtual machine where your GitHub Actions workflow actually executes.
# 1) GitHub‑hosted runners are virtual machines provided by GitHub to execute GitHub Actions workflows, 
     # offering preconfigured environments (Ubuntu, Windows, macOS) with they come with many software tools pre-installed and automatic provisioning/decommissioning.


